name = "yolov8l"
description = "YOLOv8l detect, head cut, XINT8"
status = "reconstructed"
evidence = ["docs/BENCHMARKS.md:119,159", "88c46057 (split suite)"]

[[step]]
id = "fetch"
env = "shell"
run = ["curl", "-L", "--fail", "-o", "models/yolov8l.pt", "https://github.com/ultralytics/assets/releases/download/v8.3.0/yolov8l.pt"]
outputs = ["models/yolov8l.pt"]
sha256 = { "models/yolov8l.pt" = "64c9115303f6a25575f82200d1b22ec409fa6bd7d08d0313884fc20d919478cd" }
note = "Ultralytics' v8.3.0 release asset, byte-identical to the file the benchmarks were built from. The Hub's Ultralytics/YOLOv8 copy is an older packaging of the same weights (all tensors equal, checked 2026-10-19), so its hash differs."

[[step]]
id = "export"
env = "resnet_env"
run = ["pipelines/yolov8n/1_export.py", "--weights", "models/yolov8l.pt", "--size", "640"]
inputs = ["models/yolov8l.pt"]
outputs = ["models/yolov8l.onnx"]
recorded_sha256 = { "models/yolov8l.onnx" = "956015e866affb98857184651db3c1bcf0cb9276219346b81d2ea38ae9c25f38" }
note = "opset 17, static batch 1, simplify=True"

[[step]]
id = "cut"
env = "resnet_env"
run = ["pipelines/yolov8n/1b_cut_head.py", "--in", "models/yolov8l.onnx", "--out", "models/yolov8l_cut.onnx"]
inputs = ["models/yolov8l.onnx"]
outputs = ["models/yolov8l_cut.onnx"]
recorded_sha256 = { "models/yolov8l_cut.onnx" = "b6a5ceadfd1ba19c92f3de70a025db63e791ae27bd8ac800d28e13d43b9cabfd" }

[[step]]
id = "quantize"
env = "resnet_env"
run = ["pipelines/yolov8n/3b_quantize_cut.py", "--in", "models/yolov8l_cut.onnx", "--out", "models/yolov8l_cut_xint8.onnx", "--calib-dir", "data/coco_calib", "--limit", "32"]
inputs = ["models/yolov8l_cut.onnx", "data/coco_calib"]
outputs = ["models/yolov8l_cut_xint8.onnx"]
recorded_sha256 = { "models/yolov8l_cut_xint8.onnx" = "6a2bad2135e1c7ee6df39d8718f0104fe6acc9f22bc4ddda20fa3038c27f3c8f" }
note = "Quark XINT8; calibration: 32 images per BENCHMARKS.md:119,159; no quantize log was found"

[[step]]
id = "compile"
env = "iron"
run = ["-m", "ignite_xdna.compiler.cli", "--engine", "graph", "--input", "models/yolov8l_cut_xint8.onnx", "--output", "build/yolov8l.ignite", "--silu-sigmoid"]
inputs = ["models/yolov8l_cut_xint8.onnx"]
outputs = ["build/yolov8l.ignite"]
note = "monolithic, overlap on: NOT YET BUILT. Every published m/l/x engine number came from the split container below; why those were split is not recorded"

[[step]]
id = "compile-split"
env = "iron"
run = ["-m", "ignite_xdna.compiler.cli", "--engine", "graph", "--input", "models/yolov8l_cut_xint8.onnx", "--output", "build/yolov8l_split.ignite", "--split-layer", "20", "--split-layer", "50", "--decouple-weights"]
inputs = ["models/yolov8l_cut_xint8.onnx"]
outputs = ["build/yolov8l_split.ignite", "build/yolov8l_split.weights"]
note = "INFERRED from the measured container's manifest (segments split at 20 and 50, decoupled weights, no silu key, retire_batch 2); no build command was recorded"

<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="ignite-xdna: a bare-metal engine for AMD's XDNA1 NPU">
  <!-- The logo is the array itself (docs/SILICON.md): 5 physical columns, the leftmost unreachable;
       per column one shim tile, one mem tile and four AIE2 core tiles. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f17"/>
      <stop offset="1" stop-color="#161b26"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ed1c24"/>
      <stop offset="1" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ed1c24"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ed1c24" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ed1c24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="18" fill="url(#dots)"/>
  <ellipse cx="190" cy="180" rx="210" ry="170" fill="url(#halo)"/>

  <!-- stream switch: vertical links per reachable column, horizontal links per row -->
  <g stroke="#ff9a3c" stroke-opacity="0.28" stroke-width="2">
    <line x1="149" y1="56" x2="149" y2="310"/>
    <line x1="191" y1="56" x2="191" y2="310"/>
    <line x1="233" y1="56" x2="233" y2="310"/>
    <line x1="275" y1="56" x2="275" y2="310"/>
    <line x1="132" y1="73" x2="292" y2="73"/>
    <line x1="132" y1="115" x2="292" y2="115"/>
    <line x1="132" y1="157" x2="292" y2="157"/>
    <line x1="132" y1="199" x2="292" y2="199"/>
  </g>

  <!-- column 0: physically present, unreachable on this machine -->
  <g fill="none" stroke="#5b6475" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 4">
    <rect x="90" y="56" width="34" height="34" rx="6"/>
    <rect x="90" y="98" width="34" height="34" rx="6"/>
    <rect x="90" y="140" width="34" height="34" rx="6"/>
    <rect x="90" y="182" width="34" height="34" rx="6"/>
    <rect x="90" y="236" width="34" height="34" rx="6"/>
    <rect x="90" y="290" width="34" height="14" rx="4"/>
  </g>

  <!-- 16 reachable AIE2 cores (rows 2-5); brightness is decoration, not a measurement -->
  <g filter="url(#glow)">
    <rect x="132" y="56"  width="34" height="34" rx="6" fill="url(#fire)"/>
    <rect x="174" y="56"  width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.75"/>
    <rect x="216" y="56"  width="34" height="34" rx="6" fill="url(#fire)"/>
    <rect x="258" y="56"  width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.55"/>
    <rect x="132" y="98"  width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.8"/>
    <rect x="174" y="98"  width="34" height="34" rx="6" fill="url(#fire)"/>
    <rect x="216" y="98"  width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.6"/>
    <rect x="258" y="98"  width="34" height="34" rx="6" fill="url(#fire)"/>
    <rect x="132" y="140" width="34" height="34" rx="6" fill="url(#fire)"/>
    <rect x="174" y="140" width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.65"/>
    <rect x="216" y="140" width="34" height="34" rx="6" fill="url(#fire)"/>
    <rect x="258" y="140" width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.85"/>
    <rect x="132" y="182" width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.7"/>
    <rect x="174" y="182" width="34" height="34" rx="6" fill="url(#fire)"/>
    <rect x="216" y="182" width="34" height="34" rx="6" fill="url(#fire)" fill-opacity="0.8"/>
    <rect x="258" y="182" width="34" height="34" rx="6" fill="url(#fire)"/>
  </g>

  <!-- 4 reachable mem tiles (512 KB each) and shim tiles -->
  <g fill="#1d2433" stroke="#ffb347" stroke-width="1.5">
    <rect x="132" y="236" width="34" height="34" rx="6"/>
    <rect x="174" y="236" width="34" height="34" rx="6"/>
    <rect x="216" y="236" width="34" height="34" rx="6"/>
    <rect x="258" y="236" width="34" height="34" rx="6"/>
  </g>
  <g fill="#ffb347" fill-opacity="0.35">
    <rect x="140" y="246" width="18" height="3" rx="1.5"/><rect x="140" y="253" width="18" height="3" rx="1.5"/>
    <rect x="182" y="246" width="18" height="3" rx="1.5"/><rect x="182" y="253" width="18" height="3" rx="1.5"/>
    <rect x="224" y="246" width="18" height="3" rx="1.5"/><rect x="224" y="253" width="18" height="3" rx="1.5"/>
    <rect x="266" y="246" width="18" height="3" rx="1.5"/><rect x="266" y="253" width="18" height="3" rx="1.5"/>
  </g>
  <g fill="#8b95a8">
    <rect x="132" y="290" width="34" height="14" rx="4"/>
    <rect x="174" y="290" width="34" height="14" rx="4"/>
    <rect x="216" y="290" width="34" height="14" rx="4"/>
    <rect x="258" y="290" width="34" height="14" rx="4"/>
  </g>
  <g font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace" font-size="11" fill="#6b7489">
    <text x="306" y="139">cores</text>
    <text x="306" y="257">mem</text>
    <text x="306" y="301">shim</text>
  </g>

  <!-- wordmark -->
  <g font-family="'Cascadia Code','JetBrains Mono',Consolas,Menlo,monospace">
    <text x="400" y="160" font-size="76" font-weight="700" fill="url(#word)">ignite<tspan fill="#e6edf3">-xdna</tspan></text>
    <text x="404" y="210" font-size="24" fill="#c9d1d9">A bare-metal engine for AMD's XDNA1 NPU,</text>
    <text x="404" y="242" font-size="24" fill="#c9d1d9">and the measurements behind it.</text>
    <text x="404" y="292" font-size="16" fill="#7d8799">Phoenix · Hawk Point · 16 AIE2 cores · 1.80 GHz · every number logged</text>
  </g>
</svg>
